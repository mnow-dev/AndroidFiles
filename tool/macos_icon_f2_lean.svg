<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AndroidFiles macOS App Icon Alternate (Option C: BG-2 Northern Lights Mesh + Leaning Frosted Bot + F2 Liquid Glass 3-Layer Pocket) -->
  <defs>
    <filter id="squircle-shadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#05292A" flood-opacity="0.32"/>
    </filter>
    <filter id="folder-shadow" x="-18%" y="-16%" width="136%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#05292A" flood-opacity="0.32"/>
    </filter>
    <filter id="bot-shadow" x="-20%" y="-16%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#042624" flood-opacity="0.30"/>
    </filter>
    <filter id="lip-shadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="-8" stdDeviation="10" flood-color="#042624" flood-opacity="0.20"/>
    </filter>

    <linearGradient id="bg-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#159E6E"/>
      <stop offset="48%" stop-color="#0D6A68"/>
      <stop offset="100%" stop-color="#0C3B5C"/>
    </linearGradient>
    <radialGradient id="bg-rad1" cx="18%" cy="16%" r="65%">
      <stop offset="0%" stop-color="#6BFFA9" stop-opacity="0.56"/>
      <stop offset="100%" stop-color="#6BFFA9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-rad2" cx="86%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#38D6E8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38D6E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-rad3" cx="50%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#1CE084" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#1CE084" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bot-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#C8FFF0" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="folder-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#C8F2EC" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="folder-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#DCF4F0" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="arrow-deboss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D7165" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#158C7D" stop-opacity="0.20"/>
    </linearGradient>

    <clipPath id="bot-clip">
      <path d="M 326 496 A 186 186 0 0 1 698 496 L 698 560 L 326 560 Z"/>
    </clipPath>
    <clipPath id="upper-clip">
      <rect x="0" y="0" width="1024" height="540"/>
    </clipPath>
  </defs>

  <!-- Apple 824 / 1024 Continuous Squircle -->
  <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-base)" filter="url(#squircle-shadow)"/>
  <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-rad1)"/>
  <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-rad2)"/>
  <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-rad3)"/>
  <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.48" stroke-width="4.5"/>

  <!-- LAYER 1: Frosted Liquid Glass Back Folder Page -->
  <g filter="url(#folder-shadow)">
    <path d="M 224 410 C 224 376 252 348 286 348 H 426 C 448 348 468 359 481 377 L 512 416 H 738 C 772 416 800 444 800 478 V 736 C 800 772 770 802 734 802 H 290 C 254 802 224 772 224 736 Z" fill="url(#folder-back)" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="3.5"/>
  </g>

  <!-- LAYER 2: Frosted White-Glass Android Bot (+11 deg right peek, occluded cleanly over back tab) -->
  <g clip-path="url(#upper-clip)">
    <g transform="translate(26, 8) rotate(11 512 500)" filter="url(#bot-shadow)">
      <line x1="422" y1="306" x2="372" y2="224" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="26" stroke-linecap="round"/>
      <line x1="602" y1="306" x2="652" y2="224" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="26" stroke-linecap="round"/>
      <g clip-path="url(#bot-clip)">
        <g transform="rotate(-11 512 500) translate(-26, -8)">
          <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-base)"/>
          <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-rad1)"/>
          <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-rad2)"/>
          <path d="M 286 100 H 738 C 858 100 924 166 924 286 V 738 C 924 858 858 924 738 924 H 286 C 166 924 100 858 100 738 V 286 C 100 166 166 100 286 100 Z" fill="url(#bg-rad3)"/>
        </g>
      </g>
      <path d="M 326 496 A 186 186 0 0 1 698 496 L 698 560 L 326 560 Z" fill="url(#bot-glass)" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="5"/>
      <circle cx="436" cy="404" r="22" fill="#FFFFFF" opacity="0.96"/>
      <circle cx="588" cy="404" r="22" fill="#FFFFFF" opacity="0.96"/>
    </g>
  </g>

  <!-- LAYER 3: Frosted Liquid Glass Front Folder Pocket -->
  <g filter="url(#lip-shadow)">
    <rect x="224" y="480" width="576" height="322" rx="54" fill="url(#folder-front)" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="4"/>
    <rect x="226" y="510" width="572" height="3.5" fill="#FFFFFF" opacity="0.40"/>
  </g>

  <!-- Soft Debossed Download Arrow -->
  <g transform="translate(0, 4)">
    <path d="M 512 560 C 527 560 539 572 539 587 V 664 L 576 627 C 587 616 604 616 615 627 C 626 638 626 655 615 666 L 531 749 C 520 760 504 760 493 749 L 409 666 C 398 655 398 638 409 627 C 420 616 437 616 448 627 L 485 664 V 587 C 485 572 497 560 512 560 Z" fill="#FFFFFF" opacity="0.68"/>
  </g>
  <path d="M 512 560 C 527 560 539 572 539 587 V 664 L 576 627 C 587 616 604 616 615 627 C 626 638 626 655 615 666 L 531 749 C 520 760 504 760 493 749 L 409 666 C 398 655 398 638 409 627 C 420 616 437 616 448 627 L 485 664 V 587 C 485 572 497 560 512 560 Z" fill="url(#arrow-deboss)"/>
</svg>
